# Nginx Configuration for Complete Crawler Protection
# Add this to your nginx server block

# Block all crawlers and bots
location / {
    # Set comprehensive noindex headers
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noyaca" always;
    
    # Block specific user agents
    if ($http_user_agent ~* (googlebot|bingbot|slurp|duckduckbot|baiduspider|yandexbot|facebookexternalhit|twitterbot|linkedinbot|whatsapp|applebot|semrushbot|ahrefsbot|mj12bot|dotbot)) {
        return 403;
    }
    
    # Block generic bot patterns
    if ($http_user_agent ~* (bot|crawler|spider|scraper|indexer|fetcher)) {
        return 403;
    }
    
    # Block requests with no user agent (often bots)
    if ($http_user_agent = "") {
        return 403;
    }
    
    # Block requests with suspicious patterns
    if ($http_user_agent ~* (python|curl|wget|libwww|perl|java|ruby|php)) {
        return 403;
    }
    
    # Additional security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    
    # Your normal proxy/static file configuration here
    try_files $uri $uri/ /index.html;
}

# Block access to robots.txt (optional - some prefer to serve it)
# location = /robots.txt {
#     return 403;
# }

# Block access to sitemap files
location ~* \.(xml|sitemap)$ {
    return 403;
}

# Block access to common bot paths
location ~* /(admin|wp-admin|wp-login|phpmyadmin|administrator) {
    return 403;
}

# Block access to sensitive files
location ~* \.(htaccess|htpasswd|ini|log|sh|sql|conf|bak|backup|old|tmp|temp)$ {
    return 403;
}

# Block access to hidden files
location ~ /\. {
    return 403;
}
