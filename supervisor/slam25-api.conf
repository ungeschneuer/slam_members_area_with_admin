[program:slam25-api]
command=/bin/sh -c "node scripts/startup-checks.js && node server/server.js"
directory=/Users/marcel/Developer/slam_members_area_with_admin
autostart=true
autorestart=unexpected
startsecs=10
startretries=3
stopsignal=SIGTERM
stopwaitsecs=30
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/slam25/api.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=NODE_ENV="production",PORT="3005"


